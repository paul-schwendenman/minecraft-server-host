[Service]
User=minecraft
Group=minecraft
EnvironmentFile=-/etc/minecraft.env

# Skip the backup on crash-loop iterations (a failed start that ran under
# 5 minutes); keep it for clean stops and for crashes after real play.
ExecStopPost=/usr/local/libexec/minecraft/stop-gate --unit %n --min-uptime 300 -- /usr/local/bin/minecraftctl backup create %i

# The stop-time backup is best-effort, so it mustn't hold up a world switch or
# poweroff behind the weekly prune. If prune holds the restic lock, the backup
# gives up after 1m and the world's daily timer backup (Persistent=) catches up.
# /etc/minecraft.env would override this if it ever set MC_RESTIC_RETRY_LOCK.
Environment=MC_RESTIC_RETRY_LOCK=1m
# Applies to each ExecStop/ExecStopPost command and to the JVM exiting
# separately, not to the whole stop. 5min fits a 1m lock wait plus the backup;
# the cost is a hung JVM gets 5min instead of 90s before SIGKILL.
TimeoutStopSec=5min
