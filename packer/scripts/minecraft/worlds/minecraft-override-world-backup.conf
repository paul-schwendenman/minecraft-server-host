[Service]
User=minecraft
Group=minecraft
EnvironmentFile=-/etc/minecraft.env

# Skip the backup on crash-loop iterations (a failed start that ran under
# 5 minutes); keep it for clean stops and for crashes after real play.
ExecStopPost=/usr/local/bin/minecraft-stop-gate --unit %n --min-uptime 300 -- /usr/local/bin/minecraftctl backup create %i
