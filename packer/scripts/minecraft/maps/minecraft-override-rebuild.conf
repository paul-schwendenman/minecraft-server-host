# Not currently installed by any packer script; map builds run from
# minecraft-map-build@.timer instead.
[Service]
User=minecraft
Group=minecraft
UMask=002
EnvironmentFile=-/etc/minecraft.env
ProtectHome=no

# Only rebuild after a clean stop. A crash never warrants a re-render.
ExecStopPost=/usr/local/libexec/minecraft/stop-gate --unit %n -- /usr/local/bin/minecraftctl map build now %i
ExecStopPost=/usr/local/libexec/minecraft/stop-gate --unit %n -- /usr/local/bin/minecraftctl map manifest %i --update-index
