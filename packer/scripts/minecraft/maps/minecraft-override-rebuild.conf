# Not currently installed by any packer script; map builds run from
# minecraft-map-build@.timer instead.
[Service]
User=minecraft
Group=minecraft
UMask=002
EnvironmentFile=-/etc/minecraft.env
ProtectHome=no

# Only rebuild after a clean stop. A crash never warrants a re-render.
ExecStopPost=/usr/local/bin/minecraft-stop-gate --unit %n -- /usr/local/bin/rebuild-map.sh /srv/minecraft-server/%i
ExecStopPost=/usr/local/bin/minecraft-stop-gate --unit %n -- /usr/local/bin/build-map-manifests.sh /srv/minecraft-server/%i
