[project]
name = "block-palette"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
